name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android ফোল্ডার repo-তে রাখা হয়নি, বিল্ডের সময় তৈরি হয়
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.hisabkhata --project-name hisab_khata .
          rm -rf test

      - name: Patch AndroidManifest (internet permission + app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="হিসাব খাতা"#' "$M"

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: hisab-khata-apk
          path: build/app/outputs/flutter-apk/app-release.apk
